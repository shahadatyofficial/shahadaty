<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملفي الرقمي | شهادتي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9fc;color:#0c2d4e;font-family:Cairo,sans-serif}.nav{background:#0c2d4e;color:#fff;padding:15px 7%;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none}.wrap{max-width:850px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:25px;margin-bottom:18px}label{display:block;font-size:12px;font-weight:700;color:#64748b;margin:10px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dbe7f0;border-radius:10px;font:14px Cairo}button{background:#0369a1;color:#fff;border:0;border-radius:10px;padding:11px 20px;font:700 13px Cairo;cursor:pointer;margin-top:12px}.msg{padding:10px;border-radius:9px;margin-top:12px;background:#eff6ff}.cert{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:10px}.hidden{display:none}</style></head><body><nav class="nav"><a href="index.html"><b>شهادتي</b></a><a href="verify.html">التحقق</a></nav><main class="wrap"><section class="card" id="auth"><h2>ملف الخريج الرقمي</h2><p>أدخل بريدك الإلكتروني لاستلام رابط دخول آمن.</p><label>البريد الإلكتروني</label><input id="email" type="email" dir="ltr"><button onclick="sendOtp()">إرسال رابط الدخول</button><div id="authMsg" class="msg hidden"></div></section><section class="card hidden" id="profile"><h2>بياناتي</h2><label>الاسم الكامل</label><input id="name"><label>رقم الهاتف</label><input id="phone" dir="ltr"><label>المحافظة</label><input id="gov"><label>نبذة</label><textarea id="bio"></textarea><button onclick="saveProfile()">حفظ الملف</button><div id="saveMsg" class="msg hidden"></div><h3>شهاداتي</h3><div id="certs">جاري التحميل...</div></section></main><script>const SU='https://snteiiavvaaumgaegazn.supabase.co';const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZSIsInJlZiI6InNudGVpaWF2dmFhdW1nYWVnYXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0ODEyODYsImV4cCI6MjA5OTA1NzI4Nn0.7kmeHkDL1xNcNbUGwds-kUyIa7R6KbJkndDZM1qVk6A';const sb=supabase.createClient(SU,SK);const msg=(id,t)=>{const e=document.getElementById(id);e.textContent=t;e.classList.remove('hidden')};async function sendOtp(){const email=document.getElementById('email').value.trim().toLowerCase();if(!email)return msg('authMsg','أدخل البريد الإلكتروني.');const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});msg('authMsg',error?error.message:'تم إرسال رابط الدخول إلى بريدك الإلكتروني.');}async function load(){const{data:{user}}=await sb.auth.getUser();if(!user)return;document.getElementById('auth').classList.add('hidden');document.getElementById('profile').classList.remove('hidden');let{data:p}=await sb.from('graduate_profiles').select('*').eq('auth_user_id',user.id).maybeSingle();if(!p){await sb.from('graduate_profiles').insert({auth_user_id:user.id,full_name:user.user_metadata?.full_name||user.email,email:user.email});p={full_name:user.email,email:user.email};}document.getElementById('name').value=p.full_name||'';document.getElementById('phone').value=p.phone||'';document.getElementById('gov').value=p.governorate||'';document.getElementById('bio').value=p.bio||'';const{data:cs}=await sb.rpc('graduate_my_certificates');document.getElementById('certs').innerHTML=(cs||[]).length?cs.map(c=>`<div class="cert"><b>${c.course}</b><br>رقم الشهادة: ${c.cert_number}<br>الإصدار: ${new Date(c.issue_date).toLocaleDateString('ar-EG')} · ${c.grade||'ناجح'}<br><a href="certificate.html?id=${encodeURIComponent(c.cert_number)}">عرض الشهادة</a></div>`).join(''):'لا توجد شهادات مرتبطة بهذا الهاتف بعد.';}async function saveProfile(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const{error}=await sb.from('graduate_profiles').update({full_name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),governorate:document.getElementById('gov').value.trim(),bio:document.getElementById('bio').value.trim()}).eq('auth_user_id',user.id);msg('saveMsg',error?error.message:'تم حفظ الملف.');}sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();</script></body></html>
