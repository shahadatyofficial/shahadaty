<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة الشركات | شهادتي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f9fc;color:#0c2d4e;font-family:Cairo,sans-serif}.nav{background:#0c2d4e;color:#fff;padding:15px 7%;display:flex;justify-content:space-between;align-items:center}.nav a{color:#fff;text-decoration:none}.wrap{max-width:850px;margin:40px auto;padding:0 20px}.hero{background:linear-gradient(135deg,#0c2d4e,#0369a1);color:#fff;border-radius:22px;padding:36px;margin-bottom:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:25px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe7f0;border-radius:10px;font:14px Cairo;background:#fbfdff}textarea{min-height:100px}.btn{background:#0369a1;color:#fff;border:0;border-radius:10px;padding:12px 22px;font:700 13px Cairo;cursor:pointer}.msg{margin-top:15px;padding:12px;border-radius:10px;display:none}.ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#b91c1c}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html"><b>شهادتي</b></a><a href="verify.html">التحقق من شهادة</a></nav><main class="wrap"><section class="hero"><h1>بوابة الشركات والمستشفيات</h1><p>أرسل احتياجك الوظيفي، وفريق شهادتي يتولى مراجعة الطلب والتواصل معك.</p></section><section class="card"><h2>طلب ترشيح كفاءات</h2><div class="grid"><div><label>اسم الشركة / المستشفى *</label><input id="company"></div><div><label>اسم مسؤول التواصل *</label><input id="contact"></div><div><label>البريد الإلكتروني *</label><input id="email" type="email" dir="ltr"></div><div><label>رقم الهاتف</label><input id="phone" dir="ltr"></div><div><label>المؤهل / التخصص المطلوب *</label><input id="qualification"></div><div><label>المحافظة</label><input id="gov"></div><div><label>سنة التخرج</label><input id="year" placeholder="2026" dir="ltr"></div><div><label>عدد الوظائف</label><input id="positions" type="number" min="1" value="1" dir="ltr"></div><div class="full"><label>تفاصيل الطلب</label><textarea id="message"></textarea></div></div><button class="btn" onclick="sendRequest()">إرسال الطلب</button><div id="msg" class="msg"></div></section></main><script>const SU='https://snteiiavvaaumgaegazn.supabase.co';const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZSIsInJlZiI6InNudGVpaWF2dmFhdW1nYWVnYXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0ODEyODYsImV4cCI6MjA5OTA1NzI4Nn0.7kmeHkDL1xNcNbUGwds-kUyIa7R6KbJkndDZM1qVk6A';</script><script>const sb=supabase.createClient(SU,SK);async function sendRequest(){const v=id=>document.getElementById(id).value.trim(),msg=document.getElementById('msg');msg.style.display='none';if(!v('company')||!v('contact')||!v('email')||!v('qualification')){msg.className='msg err';msg.textContent='يرجى تعبئة الحقول المطلوبة.';msg.style.display='block';return;}const{error}=await sb.from('recruitment_requests').insert({company_name:v('company'),contact_name:v('contact'),contact_email:v('email').toLowerCase(),contact_phone:v('phone'),qualification:v('qualification'),governorate:v('gov'),graduation_year:v('year'),positions_needed:Math.max(1,parseInt(v('positions')||'1')),message:v('message')});if(error){msg.className='msg err';msg.textContent='تعذر إرسال الطلب: '+error.message;msg.style.display='block';return;}msg.className='msg ok';msg.textContent='تم استلام طلبك بنجاح. سيتواصل معك فريق شهادتي.';msg.style.display='block';}</script></body></html>
