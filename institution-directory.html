<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دليل المراكز والمؤسسات المعتمدة | شهادتي العلمية</title>
<meta name="description" content="اكتشف المراكز والمؤسسات التعليمية المعتمدة على منصة شهادتي العلمية وفروعها ودوراتها ووسائل التواصل معها.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0c2d4e;--blue:#0369a1;--gold:#b08d48;--muted:#64748b;--line:#e3eaf2;--bg:#f5f8fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Cairo,sans-serif}
header{background:linear-gradient(125deg,#0c2d4e,#075985 68%,#0e7490);color:#fff;padding:42px 18px 48px;text-align:center}
header a{color:#fff;text-decoration:none;opacity:.9;font-size:12px}.eyebrow{display:inline-block;border:1px solid #ffffff55;border-radius:30px;padding:6px 15px;font-size:11px;margin-bottom:13px;color:#f5d58a}
h1{font:900 clamp(26px,4vw,42px) Tajawal;margin:0 0 10px}header p{margin:0 auto;max-width:650px;color:#dbeafe;font-size:14px;line-height:1.9}
main{max-width:1180px;margin:-22px auto 60px;padding:0 16px}.tools{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 35px #0c2d4e10;display:grid;grid-template-columns:1fr 230px;gap:10px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font:13px Cairo;outline:none}input:focus,select:focus{border-color:var(--blue)}
.count{color:var(--muted);font-size:12px;margin:18px 2px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px 14px;text-align:center;cursor:pointer;transition:.2s;box-shadow:0 5px 18px #0c2d4e08}.card:hover{transform:translateY(-4px);border-color:#b8d9eb;box-shadow:0 14px 28px #0c2d4e12}
.logo{width:104px;height:104px;border-radius:22px;object-fit:contain;padding:9px;background:#f8fafc;border:1px solid #edf1f5;margin:0 auto 13px;display:block}.logo-fallback{width:104px;height:104px;border-radius:22px;margin:0 auto 13px;display:grid;place-items:center;background:linear-gradient(145deg,#0c2d4e,#0369a1);color:#f4d58a;font-size:32px;font-weight:900}
.card h2{font-size:15px;margin:0 0 6px}.type{font-size:11px;color:var(--muted)}.verified{display:inline-flex;margin-top:11px;padding:4px 10px;border-radius:20px;background:#effaf3;color:#15803d;font-size:10px;font-weight:800}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:15px;padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:#071a2fcc;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modal-card{width:min(100%,720px);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 24px 70px #0004}.modal-head{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.modal-head img,.modal-head .logo-fallback{width:78px;height:78px;flex:none;margin:0}.modal-head h2{margin:0 0 5px;font-size:19px}.modal-head p{margin:0;color:var(--muted);font-size:12px}.close{margin-right:auto;border:0;background:#eef3f8;border-radius:10px;padding:8px 12px;font:700 13px Cairo;cursor:pointer}
.modal-body{padding:20px}.section{margin:0 0 20px}.section h3{font-size:14px;margin:0 0 10px;color:var(--blue)}.section p{font-size:13px;line-height:2;margin:0;color:#334155}.items{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.8}.item b{display:block;font-size:13px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:20px;background:#eff6ff;color:#075985;font-size:11px}.contact{display:flex;gap:8px;flex-wrap:wrap}.contact a{display:inline-block;padding:9px 14px;border-radius:10px;background:#0c2d4e;color:#fff;text-decoration:none;font-size:12px;font-weight:700}.contact a.whatsapp{background:#16834b}
@media(max-width:620px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:16px 9px}.logo,.logo-fallback{width:84px;height:84px}.modal-head{padding:14px}.modal-body{padding:15px}.modal-head h2{font-size:16px}}
</style></head>
<body>
<header><a href="index.html">← العودة إلى شهادتي العلمية</a><div class="eyebrow">الدليل الرسمي للمؤسسات</div><h1>دليل المراكز والمؤسسات المعتمدة</h1><p>اكتشف المؤسسات التعليمية ومراكز التدريب المنشورة بعد مراجعة إدارة شهادتي العلمية، وتعرّف على فروعها وبرامجها وطرق التواصل معها.</p></header>
<main><div class="tools"><input id="search" type="search" placeholder="ابحث باسم المركز أو التخصص أو الدورة..."><select id="governorate"><option value="">كل المحافظات</option></select></div><div class="count" id="count">جارٍ تحميل المؤسسات...</div><div class="grid" id="cards"></div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><div class="modal-head" id="modalHead"></div><div class="modal-body" id="modalBody"></div></div></div>
<script>
const SUPABASE_URL='https://snteiiavvaaumgaegazn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNudGVpaWF2dmFhdW1nYWVnYXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0ODEyODYsImV4cCI6MjA5OTA1NzI4Nn0.7kmeHkDL1xNcNbUGwds-kUyIa7R6KbJkndDZM1qVk6A';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let institutions=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tel=v=>String(v||'').replace(/[^0-9+]/g,'');
function logoMarkup(x,small=false){return x.logo_url?'<img class="logo" '+(small?'style="width:78px;height:78px;margin:0" ':'')+'src="'+esc(x.logo_url)+'" alt="شعار '+esc(x.institution_name)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;logo-fallback&quot;>ش</div>\'">':'<div class="logo-fallback" '+(small?'style="width:78px;height:78px;margin:0"':'')+'>ش</div>';}
function render(){
 const q=$('search').value.trim().toLowerCase(),gov=$('governorate').value;
 const rows=institutions.filter(x=>(!gov||x.governorate===gov)&&(!q||[x.institution_name,x.description,x.institution_type,...(x.courses||[]).map(c=>c.name)].join(' ').toLowerCase().includes(q)));
 $('count').textContent='عدد المؤسسات المنشورة: '+rows.length.toLocaleString('ar-EG');
 $('cards').innerHTML=rows.length?rows.map((x)=>'<article class="card" tabindex="0" role="button" aria-label="عرض '+esc(x.institution_name)+'" data-id="'+esc(x.institution_id)+'">'+logoMarkup(x)+'<h2>'+esc(x.institution_name)+'</h2><div class="type">'+esc(x.institution_type||'مؤسسة تعليمية')+(x.governorate?' · '+esc(x.governorate):'')+'</div><span class="verified">✓ ملف معتمد ومنشور</span></article>').join(''):'<div class="empty">لا توجد مؤسسات منشورة تطابق البحث حاليًا.</div>';
}
function section(title,content){return '<section class="section"><h3>'+title+'</h3>'+content+'</section>';}
function openProfile(id){
 const x=institutions.find(v=>v.institution_id===id);if(!x)return;
 $('modalHead').innerHTML=logoMarkup(x,true)+'<div><h2 id="modalTitle">'+esc(x.institution_name)+'</h2><p>'+esc(x.institution_type||'مؤسسة تعليمية')+(x.governorate?' · '+esc(x.governorate):'')+'</p><span class="verified">✓ ملف معتمد ومنشور</span></div><button class="close" type="button" onclick="closeProfile()">إغلاق ✕</button>';
 const branches=x.branches||[],courses=x.courses||[];
 const branchHtml=branches.length?'<div class="items">'+branches.map(b=>'<div class="item"><b>'+esc(b.name)+'</b>'+[b.governorate,b.address,b.phone].filter(Boolean).map(esc).join(' · ')+'</div>').join('')+'</div>':'<p>لم تتم إضافة فروع معلنة بعد.</p>';
 const courseHtml=courses.length?'<div class="chips">'+courses.map(c=>'<span class="chip">'+esc(c.name)+(c.specialization?' · '+esc(c.specialization):'')+'</span>').join('')+'</div>':'<p>لا توجد دورات معلنة حاليًا.</p>';
 const phone=tel(x.public_phone),wa=tel(x.whatsapp);
 const links='<div class="contact">'+(phone?'<a href="tel:'+esc(phone)+'">اتصال بالمركز</a>':'')+(wa?'<a class="whatsapp" target="_blank" rel="noopener" href="https://wa.me/'+esc(wa.replace(/^\+/,''))+'">واتساب</a>':'')+(x.public_email?'<a href="mailto:'+esc(x.public_email)+'">البريد الإلكتروني</a>':'')+(x.website_url?'<a target="_blank" rel="noopener" href="'+esc(x.website_url)+'">الموقع الإلكتروني</a>':'')+'</div>';
 $('modalBody').innerHTML=section('نبذة عن المؤسسة','<p>'+esc(x.description||'لا توجد نبذة متاحة.')+'</p>')+section('فروع المؤسسة',branchHtml)+section('الدورات والبرامج',courseHtml)+section('بيانات التواصل',links||'<p>لم تُضف بيانات تواصل عامة.</p>');
 $('modal').classList.add('open');document.body.style.overflow='hidden';
}
function closeProfile(){$('modal').classList.remove('open');document.body.style.overflow='';}
$('cards').addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(card)openProfile(card.dataset.id);});
$('cards').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const card=e.target.closest('[data-id]');if(card){e.preventDefault();openProfile(card.dataset.id);}}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeProfile();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfile();});
$('search').addEventListener('input',render);$('governorate').addEventListener('change',render);
async function init(){
 const {data,error}=await sb.rpc('get_public_institution_directory');
 if(error){$('count').textContent='تعذر تحميل الدليل: '+error.message;$('cards').innerHTML='<div class="empty">حدث خطأ أثناء تحميل المؤسسات. يرجى المحاولة لاحقًا.</div>';return;}
 institutions=data||[];
 const govs=[...new Set(institutions.map(x=>x.governorate).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
 $('governorate').innerHTML='<option value="">كل المحافظات</option>'+govs.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');
 render();
}
init();
</script>
</body></html>
