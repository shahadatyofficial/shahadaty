name: Project validation

on:
  push:
    branches: [workflow-complete]
  pull_request:
    branches: [main]

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate pages, RPC references, and SQL delimiters
        run: node scripts/validate-project.mjs
