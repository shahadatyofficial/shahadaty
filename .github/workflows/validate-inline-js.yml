name: Validate inline JavaScript
on:
  push:
    branches: [main, development/platform-core, feature/live-support-chat]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript in platform pages
        run: python3 scripts/check-inline-js.py
      - name: Validate support chat JavaScript
        run: node --check support-chat.js
