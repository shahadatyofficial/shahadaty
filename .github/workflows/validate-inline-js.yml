name: Validate inline JavaScript
on:
  push:
    branches: [main, development/platform-core]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, development/phase-0-audit]
jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript in platform pages
        run: python3 scripts/check-inline-js.py
      - name: Check platform workflow integration points
        run: python3 scripts/check-platform-integration.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check institution invitation compatibility function
        run: deno check supabase/functions/institution-invite-member/index.ts
      - name: Type-check direct institution staff account function
        run: deno check supabase/functions/institution-staff-create-account/index.ts
      - name: Type-check graduate account claim function
        run: deno check supabase/functions/graduate-account-claim/index.ts
      - name: Type-check institution graduate account creation function
        run: deno check supabase/functions/graduate-institution-account-create/index.ts
      - name: Type-check direct graduate application function
        run: deno check supabase/functions/graduate-application-submit/index.ts
