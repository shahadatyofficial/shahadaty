<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السجل الرقمي | شهادتي العلمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#0c2d4e;--blue:#0369a1;--sky:#0284c7;--gold:#b08d48;--bg:#f5f7fa;--border:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Cairo,Tajawal,sans-serif}.top{background:var(--navy);padding:14px 22px;color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Tajawal;font-size:21px;font-weight:900}.brand small{display:block;font-family:Cairo;font-size:9px;letter-spacing:1.5px;opacity:.65}.actions{display:flex;gap:8px}.actions button,.actions a{font:700 12px Cairo;background:#fff;color:var(--navy);border:0;border-radius:9px;padding:9px 13px;text-decoration:none;cursor:pointer}.wrap{max-width:980px;margin:34px auto;padding:0 18px}.loading,.error{text-align:center;background:#fff;border:1px solid var(--border);border-radius:18px;padding:60px 25px}.spin{width:42px;height:42px;border:4px solid #dbeafe;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}.certificate{background:#fff;border:8px double var(--gold);border-radius:18px;padding:14px;box-shadow:0 15px 45px rgba(12,45,78,.12)}.inner{border:1px solid #d6b96b;padding:48px 42px;min-height:620px;position:relative;text-align:center}.seal{width:92px;height:92px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;margin:0 auto 20px;color:var(--gold);font-size:35px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800}.title{font-family:Tajawal;font-size:38px;font-weight:900;margin:6px 0;color:var(--navy)}.subtitle{font-size:14px;color:var(--muted)}.student{font-family:Tajawal;font-size:31px;font-weight:900;margin:26px 0 10px}.course{font-size:18px;font-weight:800;color:var(--blue);margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:720px;margin:0 auto 25px}.box{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fbfdff}.lbl{font-size:9px;color:var(--muted);font-weight:700}.val{font-size:12px;font-weight:800;margin-top:3px}.verify{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:25px}.qr{width:110px;height:110px;display:grid;place-items:center}.number{font-family:monospace;font-size:15px;font-weight:900;color:var(--navy)}.valid{color:#15803d;font-weight:800;font-size:12px;margin-top:5px}.foot{margin-top:28px;color:var(--muted);font-size:10px}.error h2{color:#dc2626;font-size:20px}@media(max-width:650px){.inner{padding:30px 18px}.title{font-size:30px}.student{font-size:24px}.grid{grid-template-columns:1fr 1fr}.verify{flex-direction:column}.actions a,.actions button{padding:8px}.top{padding:12px 14px}}@media print{.top{display:none}.wrap{margin:0;padding:0}.certificate{box-shadow:none}.actions{display:none}body{background:#fff}}

/* Premium A4 certificate layout */
@page{size:A4 landscape;margin:0}
:root{--gold-light:#dfc37a}
.certificate{width:100%;border:5px double var(--gold);border-radius:10px;padding:8px;background:linear-gradient(145deg,#fff 0%,#fbfdff 65%,#f4f8fc 100%);box-shadow:0 18px 50px rgba(12,45,78,.16)}
.inner{min-height:0;height:100%;padding:22px 30px 18px;border:1px dashed #d6b96b;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.inner:before{content:"SHAHADATY VERIFIED";position:absolute;z-index:0;left:50%;top:51%;transform:translate(-50%,-50%) rotate(-22deg);font:900 54px Tajawal,sans-serif;letter-spacing:5px;color:rgba(3,105,161,.035);white-space:nowrap;pointer-events:none}
.inner>*{position:relative;z-index:1}
.inner:after{content:"";position:absolute;inset:7px;border:1px solid rgba(176,141,72,.25);pointer-events:none}
.seal{width:64px;height:64px;margin:0 auto 8px;font-size:25px;background:linear-gradient(135deg,#fff7df,#dfc37a);box-shadow:0 5px 18px rgba(176,141,72,.2)}
.eyebrow{font-size:10px;letter-spacing:1.5px}
.title{font-size:34px;margin:2px 0;line-height:1.2}
.subtitle{font-size:10px;max-width:720px;margin:0 auto;line-height:1.7}
.student{width:min(100%,850px);min-height:1.35em;margin:12px auto 4px;padding:0 12px 7px;border-bottom:2px solid var(--gold);font-size:clamp(22px,3vw,40px);line-height:1.3;overflow-wrap:anywhere;word-break:normal;text-wrap:balance}
.course{font-size:17px;margin:4px auto 10px;max-width:95%;overflow-wrap:anywhere}
.grid{width:100%;max-width:850px;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 auto 8px}
.box{min-width:0;padding:8px 10px;border-color:#e7e1d3;background:rgba(255,255,255,.88)}
.val{overflow-wrap:anywhere;line-height:1.5}
.verify{margin-top:6px;padding-top:8px;border-top:1px solid #e8dfcc;gap:14px}
.qr{width:88px;height:88px}
.number{font-size:14px;letter-spacing:.4px}
.valid{font-size:11px}
.foot{margin-top:3px}
.wrap{max-width:1120px;margin:24px auto;padding:0 14px}
@media(max-width:700px){
 .inner{padding:22px 14px;gap:12px}
 .title{font-size:28px}
 .student{font-size:clamp(20px,6vw,30px)}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .verify{flex-direction:row;flex-wrap:wrap}
 .certificate{padding:5px}
}
@media print{
 html,body{width:297mm!important;height:210mm!important;margin:0!important;padding:0!important;background:#fff!important}
 .top,.actions{display:none!important}
 .wrap{width:297mm!important;max-width:none!important;height:210mm!important;margin:0!important;padding:5mm!important}
 .certificate{width:100%!important;height:200mm!important;min-height:0!important;margin:0!important;padding:5px!important;border-radius:0!important;box-shadow:none!important;break-inside:avoid!important;page-break-inside:avoid!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .inner{height:100%!important;min-height:0!important;padding:13mm 14mm 9mm!important}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
 .student{font-size:clamp(22px,2.8vw,38px)!important}
}


/* Refined certificate alignment and long-content safeguards */
.inner{gap:9px;padding:22px 30px 18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.inner:before{content:"SHAHADATY VERIFIED";position:absolute;z-index:0;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-20deg);font:900 54px Tajawal,sans-serif;letter-spacing:4px;color:rgba(3,105,161,.035);white-space:nowrap;pointer-events:none}
.inner>*{position:relative;z-index:1}
.student{width:min(100%,850px);min-height:1.3em;margin:10px auto 5px;padding:0 12px 7px;line-height:1.25;overflow-wrap:anywhere;text-wrap:balance}
.course{max-width:95%;margin:5px auto 12px;line-height:1.4;overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.box{min-width:0;padding:8px 10px}
.val{overflow-wrap:anywhere;line-height:1.5}
.verify{border-top:1px solid #e8dfcc;padding-top:9px;margin-top:5px}
@media(max-width:700px){.inner{padding:22px 14px;gap:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.student{font-size:clamp(20px,6vw,30px)}}
@media print{.inner{padding:11mm 13mm 8mm!important;gap:6px!important}.student{font-size:clamp(22px,2.8vw,38px)!important}.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}

</style>
</head>
<body>
<header class="top"><div class="brand">شهادتي العلمية<small>DIGITAL RECORD & VERIFICATION</small></div><div class="actions"><button onclick="window.print()">طباعة</button><a href="verify.html">التحقق من شهادة أخرى</a></div></header>
<main class="wrap" id="app"><div class="loading"><div class="spin"></div><div>جاري تحميل الشهادة...</div></div></main>
<script>
const SU='https://snteiiavvaaumgaegazn.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNudGVpaWF2dmFhdW1nYWVnYXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0ODEyODYsImV4cCI6MjA5OTA1NzI4Nn0.7kmeHkDL1xNcNbUGwds-kUyIa7R6KbJkndDZM1qVk6A';
const sb=supabase.createClient(SU,SK);
const id=new URLSearchParams(location.search).get('id');
function esc(v){return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function load(){
  if(!id)return showError('لم يتم تحديد رقم الشهادة.');
  const {data,error}=await sb.rpc('verify_certificate_details',{p_cert_number:id});
  if(error||!data?.length)return showError('لم يتم العثور على الشهادة أو أنها غير متاحة للتحقق.');
  const c=Array.isArray(data)?data[0]:data;
  const date=new Date(c.acquisition_date||c.issue_date).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  const active=c.status==='active';
  const academic=c.record_type==='academic';
  const recordTitle=academic?'سجل مؤهل علمي':'شهادة تدريبية';
  document.getElementById('app').innerHTML=`<section class="certificate"><div class="inner">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px">
      <div style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="شعار شهادتي العلمية" style="width:66px;height:66px;object-fit:contain" onerror="this.style.display='none'"><div style="text-align:right"><strong style="font:900 22px Tajawal;color:#0c2d4e">شهادتي العلمية</strong><div style="font-size:8px;letter-spacing:1px;color:#b08d48;font-weight:800">SHAHADATY VERIFICATION PLATFORM</div></div></div>
      <div style="text-align:left;border:1px solid #e6dcc8;border-radius:9px;padding:7px 10px;background:#fff"><div style="font-size:9px;color:#64748b">رقم القيد المسجل</div><strong style="font:900 13px monospace;direction:ltr">${esc(c.cert_number)}</strong></div>
    </div>
    <div class="seal">✓</div><div class="eyebrow">${academic?'ACADEMIC QUALIFICATION RECORD':'DIGITAL TRAINING CERTIFICATE'}</div>
    <div class="title">${academic?'شهادة تسجيل مؤهل علمي':'شهادة تسجيل دورة تدريبية'}</div>
    <div class="subtitle">سجل رقمي للبيانات المقدمة من الجهة المسجلة على منصة شهادتي العلمية</div>
    <div style="max-width:850px;margin:0 auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-size:9px;color:#536579;line-height:1.7">تتيح منصة شهادتي عرض البيانات المسجلة والتحقق من وجودها فقط، ولا تصدّق على صحة المؤهل أو تمنح اعتماداً أكاديمياً أو مهنياً؛ وتظل مسؤولية صحة البيانات على الجهة المقدمة لها.</div>
    <p style="font:700 16px Amiri,serif;color:#536579;margin:0">تشهد منصة شهادتي وبناءً على البيانات المسجلة لديها بأن المتدرب / صاحب المؤهل:</p>
    <div class="student">${esc(c.student_name)}</div>${c.student_name_en?`<div style="font-size:14px;font-weight:700;color:#64748b;direction:ltr;margin:-3px 0 7px;overflow-wrap:anywhere">${esc(c.student_name_en)}</div>`:""}
    <div class="course">${esc(academic?(c.academic_degree||c.course):c.course)}</div>
    <div class="grid">
      <div class="box"><div class="lbl">${academic?'الجامعة':'جهة التسجيل'}</div><div class="val">${esc(academic?c.academic_university:c.institution_name)}</div></div>
      <div class="box"><div class="lbl">${academic?'الكلية':'نوع الجهة'}</div><div class="val">${esc(academic?c.academic_faculty:c.institution_type)}</div></div>
      <div class="box"><div class="lbl">${academic?'الدرجة العلمية':'التخصص'}</div><div class="val">${esc(academic?(c.academic_degree||c.course):c.specialization)}</div></div>
      <div class="box"><div class="lbl">${academic?'سنة الحصول على المؤهل':'تاريخ الحصول على الدورة'}</div><div class="val">${esc(academic?c.graduation_year:date)}</div></div>
      <div class="box"><div class="lbl">التقدير</div><div class="val">${esc(c.grade||'غير محدد')}</div></div>
      <div class="box"><div class="lbl">${academic?'جهة تسجيل البيانات':'مدة البرنامج'}</div><div class="val">${esc(academic?(c.source_type==='admin'?'إدارة منصة شهادتي':c.institution_name):c.duration)}</div></div>
    </div>
    <div class="verify"><div id="qrcode" class="qr"></div><div><div class="number">${esc(c.cert_number)}</div><div class="valid">${active?'✓ سجل نشط ومسجل':'⚠️ السجل غير نشط'}</div><div class="foot">امسح رمز QR أو أدخل رقم القيد للتحقق من بيانات السجل.</div></div><div style="margin-right:auto;text-align:left;font-size:9px;color:#b08d48;font-weight:800">نصنع المعرفة...<br>نبني الحاضر...<br>ونوثق المستقبل.</div></div>
  </div></section>`;
  fitCertificateName();
  window.addEventListener('resize',fitCertificateName);
  window.addEventListener('beforeprint',fitCertificateName);
  new QRCode(document.getElementById('qrcode'),{text:location.href,width:88,height:88,colorDark:'#0c2d4e',colorLight:'#ffffff'});
}
function fitCertificateName(){const fit=(el,max,min)=>{if(!el)return;let size=max;el.style.fontSize=size+'px';while(size>min&&(el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+2)){size-=0.5;el.style.fontSize=size+'px';}};fit(document.querySelector('.student'),40,18);fit(document.querySelector('.course'),22,13);fit(document.querySelector('.title'),38,24);document.querySelectorAll('.val').forEach(el=>fit(el,12,8));}
function showError(msg){document.getElementById('app').innerHTML=`<div class="error"><div style="font-size:45px">❌</div><h2>تعذر عرض الشهادة</h2><p>${esc(msg)}</p><a href="verify.html" style="color:var(--blue);font-weight:800">العودة لصفحة التحقق</a></div>`}
load();
</script>
</body></html>
